<div class="abd-backdrop" (click)="close()"></div>
<div class="abd-modal glass-strong" role="dialog" aria-modal="true">
  <div class="flex items-center gap-2 border-b border-base-content/10 px-5 py-3">
    <i-lucide name="image-down" size="18" class="text-accent"></i-lucide>
    <div class="min-w-0">
      <h2 class="truncate font-display text-sm font-semibold tracking-wide">
        Download artwork
      </h2>
      <p class="truncate font-mono text-[0.68rem] text-base-content/50">
        {{ gameCount() }} game(s) in library
      </p>
    </div>
    <button class="btn btn-ghost btn-xs btn-square ml-auto" (click)="close()">
      <i-lucide name="x" size="16"></i-lucide>
    </button>
  </div>

  <div class="abd-body flex flex-col gap-4 px-5 py-4">
    <p class="flex items-start gap-2 text-xs text-base-content/60">
      <i-lucide name="info" size="13" class="mt-0.5 shrink-0"></i-lucide>
      <span>
        Downloading:
        <strong>{{ defaultArtTypes().map(artTypeLabel).join(', ') || 'none' }}</strong>
        — change the default types in Settings. Types missing from the art
        database for a given game are skipped automatically.
      </span>
    </p>

    <label class="flex items-center gap-2 cursor-pointer select-none">
      <input
        type="checkbox"
        class="checkbox checkbox-sm checkbox-primary"
        [checked]="skipExisting()"
        (change)="skipExisting.set(!skipExisting())"
      />
      <span class="text-xs text-base-content/70">Skip existing artwork</span>
      <span class="text-[0.65rem] text-base-content/40">— don't prompt to overwrite, just skip types already on disk</span>
    </label>

    @if (artSource() === 'libretro') {
      <label class="flex items-center gap-2 cursor-pointer select-none">
        <input
          type="checkbox"
          class="checkbox checkbox-sm checkbox-primary"
          [checked]="fetchMetadata()"
          (change)="fetchMetadata.set(!fetchMetadata())"
        />
        <span class="text-xs text-base-content/70">Also fetch game info</span>
        <span class="text-[0.65rem] text-base-content/40">— genre, developer, description, release date, players</span>
      </label>
    }
  </div>

  <div class="flex items-center justify-end gap-2 border-t border-base-content/10 px-5 py-3">
    <button class="btn btn-ghost btn-sm" (click)="close()">Cancel</button>
    <button class="btn btn-primary btn-sm" (click)="submit()">
      <i-lucide name="download" size="15"></i-lucide>
      Queue {{ gameCount() }} game(s)
    </button>
  </div>
</div>
