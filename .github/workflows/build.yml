name: Build

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  # Bumps the version with commitizen based on conventional commits since the
  # last tag. `development` gets an alpha prerelease tagged with the short
  # SHA (e.g. v1.4.0-a0+f64fac5); `main` gets a stable release. No-ops (and
  # every job below is skipped) when nothing on the branch warrants a bump.
  bump:
    name: Bump version
    if: >
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/development') &&
      !startsWith(github.event.head_commit.message, 'bump:')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.cz.outputs.version }}
      tag: v${{ steps.cz.outputs.version }}
      is_prerelease: ${{ github.ref == 'refs/heads/development' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Short SHA
        id: sha
        run: echo "short=$(echo "$GITHUB_SHA" | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Bump with commitizen
        id: cz
        uses: commitizen-tools/commitizen-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          changelog_increment_filename: body.md
          changelog: ${{ github.ref == 'refs/heads/main' }}
          prerelease: ${{ github.ref == 'refs/heads/development' && 'alpha' || '' }}
          build_metadata: ${{ github.ref == 'refs/heads/development' && steps.sha.outputs.short || '' }}

      - name: Upload release notes
        if: steps.cz.outputs.version != ''
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: body.md
          if-no-files-found: ignore

  build:
    needs: [bump]
    if: >
      always() && !failure() && !cancelled() &&
      (needs.bump.result == 'skipped' ||
        (needs.bump.result == 'success' && needs.bump.outputs.version != ''))
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: package:win
            artifact: windows-build
          - os: macos-latest
            script: package:mac
            artifact: macos-build
          - os: ubuntu-latest
            script: package:linux
            artifact: linux-build

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump.outputs.version != '' && needs.bump.outputs.tag || github.sha }}

      - name: Install rpm (Linux packaging dependency)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Cache Angular dependencies
        uses: actions/cache@v4
        with:
          path: angular/node_modules
          key: ${{ matrix.os }}-angular-npm-${{ hashFiles('angular/package-lock.json') }}

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Angular dependencies
        run: npm ci
        working-directory: angular

      - name: Build (${{ matrix.script }})
        run: npm run ${{ matrix.script }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            build/*.exe
            build/*.zip
            build/*.dmg
            build/*.AppImage
            build/*.deb
            build/*.rpm
          if-no-files-found: warn

  release:
    name: Publish release
    needs: [bump, build]
    if: needs.bump.result == 'success' && needs.bump.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts
          pattern: "*-build"

      - name: Download release notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: notes
        continue-on-error: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.bump.outputs.tag }}
          name: ${{ needs.bump.outputs.tag }}
          prerelease: ${{ needs.bump.outputs.is_prerelease }}
          body_path: notes/body.md
          files: dist-artifacts/**/*
