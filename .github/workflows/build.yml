name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: package:win
            artifact: windows-build
          - os: macos-latest
            script: package:mac
            artifact: macos-build
          - os: ubuntu-latest
            script: package:linux
            artifact: linux-build

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install rpm (Linux packaging dependency)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Cache Angular dependencies
        uses: actions/cache@v4
        with:
          path: angular/node_modules
          key: ${{ matrix.os }}-angular-npm-${{ hashFiles('angular/package-lock.json') }}

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Angular dependencies
        run: npm ci
        working-directory: angular

      - name: Build (${{ matrix.script }})
        run: npm run ${{ matrix.script }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            build/*.exe
            build/*.zip
            build/*.dmg
            build/*.AppImage
            build/*.deb
            build/*.rpm
          if-no-files-found: warn

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist-artifacts/**/*
